name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: go test ./...
      - run: go vet ./...
      - run: make build
      - name: Build Avalonia macOS app and verify bundled versions
        shell: bash
        run: |
          version="$(./bin/tunscope version | awk '{print $2}')"
          case "$(uname -m)" in
            arm64) rid=osx-arm64 ;;
            x86_64) rid=osx-x64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          ./gui/package-macos.sh "$version" "$rid" "$RUNNER_TEMP/tunscope-macos"

          app_path="$RUNNER_TEMP/tunscope-macos/tunscope-$version-$rid/TunScope.app"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :TunScopeVersion' "$app_path/Contents/Info.plist")"
          marketing_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Contents/Info.plist")"
          helper_version="$("$app_path/Contents/Resources/tunscope-helper" version)"
          cli_version="$(./bin/tunscope version)"
          if [[ ! "$marketing_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid numeric macOS marketing version: $marketing_version" >&2
            exit 1
          fi
          if [[ "$helper_version" != "tunscope $app_version" || "$cli_version" != "tunscope $app_version" ]]; then
            echo "Version mismatch: app=$app_version helper='$helper_version' cli='$cli_version'" >&2
            exit 1
          fi
          test -x "$app_path/Contents/MacOS/TunScope"
          codesign --verify --deep --strict "$app_path"

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test Windows
        shell: pwsh
        run: |
          $output = @(& go test -v ./... 2>&1)
          $testExit = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($testExit -ne 0) {
            $details = (($output | Select-Object -Last 25) -join "`n")
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows Go tests failed::$details"
            exit $testExit
          }
      - run: go vet ./...
      - run: New-Item -ItemType Directory -Force bin | Out-Null
      - run: go build -trimpath -ldflags "-s -w" -o bin/tunscope-windows-amd64.exe ./cmd/tunscope
      - name: Verify Windows binary version
        shell: pwsh
        run: |
          $actual = (& .\bin\tunscope-windows-amd64.exe version | Out-String).Trim()
          $match = [regex]::Match($actual, '^tunscope\s+(?<version>.+)$')
          if (-not $match.Success) {
            throw "Unexpected version output: $actual"
          }
          $version = $match.Groups['version'].Value
          [xml]$guiProject = Get-Content -LiteralPath .\gui\TunScope.GUI.csproj -Raw
          $defaultGuiVersion = @($guiProject.Project.PropertyGroup.Version | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })[0]
          if ($defaultGuiVersion -cne $version) {
            throw "Default GUI version '$defaultGuiVersion' does not match CLI version '$version'"
          }
          "TUNSCOPE_TEST_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build self-contained Windows GUI
        shell: pwsh
        run: |
          dotnet publish .\gui\TunScope.GUI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Version=$env:TUNSCOPE_TEST_VERSION `
            -o .\bin\windows-gui
          if (-not (Test-Path -LiteralPath .\bin\windows-gui\TunScope.exe -PathType Leaf)) {
            throw 'Self-contained GUI executable was not produced'
          }
          $guiVersion = (Get-Item -LiteralPath .\bin\windows-gui\TunScope.exe).VersionInfo.ProductVersion
          $guiVersion = ($guiVersion -split '\+', 2)[0]
          if ($guiVersion -cne $env:TUNSCOPE_TEST_VERSION) {
            throw "Unexpected Windows GUI product version: $guiVersion"
          }
      - name: Build and inspect Windows package
        shell: pwsh
        run: |
          .\windows\package.ps1 `
            -Binary .\bin\tunscope-windows-amd64.exe `
            -GuiBinary .\bin\windows-gui\TunScope.exe `
            -Destination .\dist

          $archives = @(Get-ChildItem -LiteralPath .\dist -Filter '*.zip' -File)
          if ($archives.Count -ne 1) {
            throw "Expected one Windows archive, found $($archives.Count)"
          }
          $archive = $archives[0]
          $checksumPath = "$($archive.FullName).sha256"
          $expected = ((Get-Content -LiteralPath $checksumPath -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Package checksum mismatch: expected $expected, got $actual"
          }

          $extractPath = Join-Path $env:RUNNER_TEMP 'tunscope-package-check'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extractPath
          $packageRoot = @(Get-ChildItem -LiteralPath $extractPath -Directory)
          if ($packageRoot.Count -ne 1) {
            throw "Expected one package root, found $($packageRoot.Count)"
          }
          $required = @(
            'tunscope-cli.exe',
            'TunScope.exe',
            'wintun.dll',
            'README.md',
            'LICENSE.txt',
            'WINTUN-LICENSE.txt',
            'tunscope.example.json',
            'prepare-wintun.ps1',
            'install.ps1'
          )
          foreach ($name in $required) {
            $path = Join-Path $packageRoot[0].FullName $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Package is missing $name"
            }
          }
          & (Join-Path $packageRoot[0].FullName 'install.ps1') `
            -SourceDirectory $packageRoot[0].FullName `
            -InstallDirectory (Join-Path $env:RUNNER_TEMP 'TunScope-install-check') `
            -WhatIf
      - uses: actions/upload-artifact@v4
        with:
          name: tunscope-windows-amd64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
